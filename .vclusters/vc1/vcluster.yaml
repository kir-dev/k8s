sync:
  fromHost:
    events:
      enabled: true
    csiDrivers:
      enabled: auto
    csiNodes:
      enabled: auto
    csiStorageCapacities:
      enabled: auto
    storageClasses:
      enabled: true
    ingressClasses:
      enabled: false
    runtimeClasses:
      enabled: false
    priorityClasses:
      enabled: false
    nodes:
      enabled: true
      clearImageStatus: true
    # Sync the host's VolumeSnapshotClass(es) so Velero can pick one.
    # Note: these volume-snapshot sync options were removed and rejected by the
    # chart in vCluster 0.36.0, but restored in 0.37.0.
    # https://github.com/loft-sh/vcluster/blob/3a7bd345d37c91e73c1d0baef53749d8b1912dbb/chart/templates/_validate.tpl#L61-L63
    volumeSnapshotClasses:
      enabled: true
  toHost:
    networkPolicies:
      enabled: true
    # Velero needs the real PersistentVolume (with its `spec.csi`), otherwise
    # vCluster substitutes a pseudo PV and Velero skips CSI snapshots.
    persistentVolumes:
      enabled: true
    # Relay VolumeSnapshot(Content) resources from vc2 towards the host, where
    # the CSI driver + snapshot controller live. Both must be enabled together.
    volumeSnapshots:
      enabled: true
    volumeSnapshotContents:
      enabled: true

controlPlane:
  coredns:
    deployment:
      resources:
        limits:
          cpu: 256m
  distro:
    k8s:
      image:
        tag: v1.36.2
#   statefulSet:
#     persistence:
#       volumeClaim:
#         storageClass: memory-ssd

policies:
  podSecurityStandard: baseline

  resourceQuota:
    enabled: true
    quota:
      requests.cpu: 30
      limits.cpu: 60

      requests.memory: 60Gi
      limits.memory: 70Gi

      requests.ephemeral-storage: 40Gi
      limits.ephemeral-storage: 100Gi
      requests.storage: 600Gi
      memory-ssd.storageclass.storage.k8s.io/requests.storage: 100Gi
      memory-ssd-rwx.storageclass.storage.k8s.io/requests.storage: 100Gi
      node-local-zfs.storageclass.storage.k8s.io/requests.storage: 100Gi # might be wrong (probably is wrong)
      memory-hdd.storageclass.storage.k8s.io/requests.storage: 500Gi

      services.nodeports: 17
      services.loadbalancers: 16

      count/endpoints: 400
      count/pods: 100
      count/services: 400
      count/secrets: 400
      count/configmaps: 400
      count/persistentvolumeclaims: 100

  limitRange:
    enabled: true
    default:
      ephemeral-storage: 1Gi
      memory: 1Gi
      cpu: "1"
    defaultRequest:
      ephemeral-storage: 40Mi
      memory: 128Mi
      cpu: 100m
    min: { }
    max: { }

telemetry:
  enabled: false

integrations:
  metricsServer:
    enabled: true

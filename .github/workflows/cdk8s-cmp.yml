name: build-cdk8s-cmp

# Rebuilds the ArgoCD Config Management Plugin sidecar image that renders
# cdk8s Applications. Because `cdk8s import` (the slow, bloat-generating step)
# runs at image build time, the baked-in types must be refreshed whenever the
# imports in cdk8s.yaml change (e.g. after a Renovate version bump).

on:
  push:
    branches: [master, main]
    paths:
      - cdk8s.yaml
      - bun.lock
      - .cdk8s/cmp/**
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/cdk8s-cmp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cdk8s/cmp/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

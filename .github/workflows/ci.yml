name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.37.2"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache cdk8s imports
        uses: actions/cache@v4
        with:
          path: ~/.cache/cdk8s-imports
          key: cdk8s-imports-${{ hashFiles('cdk8s.yaml') }}

      - name: Import cdk8s schemas and CRDs
        run: bun run cdk8s:import

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Validate manifests (cdk8s + Kustomize/Helm)
        run: bun run validate:all

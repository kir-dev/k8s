# https://cert-manager.io/docs/installation/helm/
# https://artifacthub.io/packages/helm/cert-manager/cert-manager

# Do not set top-level `namespace: cert-manager` here: Kustomize would inject it
# onto the cluster-scoped `ClusterIssuer` CRD. The Helm chart already receives
# `namespace: cert-manager` below.
resources:
  - namespace.yaml
  - cluster-issuer.yaml

helmCharts:
  - name: cert-manager
    repo: oci://quay.io/jetstack/charts
    version: v1.19.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml

language: typescript

# https://cdk8s.io/docs/latest/cli/import/#import-types
# Helm charts are deployed via Kustomize (`*/kustomization.yaml`), so only core
# Kubernetes schemas and CRDs used by cdk8s TypeScript apps are imported here.
imports:
  - k8s@1.36.0 # version from https://github.com/cdk8s-team/cdk8s/tree/master/kubernetes-schemas

  # cdk8s-cli normally only allows one CRD file per API group, so multiple
  # files in a group overwrite each other. `.dev/cdk8s-import.ts` patches the
  # cli to aggregate them.
  # Issue: https://github.com/cdk8s-team/cdk8s-cli/issues/3797
  # Open PR: https://github.com/cdk8s-team/cdk8s-cli/pull/3798
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.5/manifests/install.yaml
  - https://github.com/cert-manager/cert-manager/releases/download/v1.19.2/cert-manager.crds.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.28.0/releases/cnpg-1.28.0.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/plugin-barman-cloud/v0.10.0/config/crd/bases/barmancloud.cnpg.io_objectstores.yaml
  - https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.88.0/bundle.yaml
  - https://raw.githubusercontent.com/traefik/traefik/v3.6.7/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml

  # Garage
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garageadmintokens.yaml
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garagebuckets.yaml
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garageclusters.yaml
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garagekeys.yaml
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garagenodes.yaml
  - https://raw.githubusercontent.com/rajsinghtech/garage-operator/v0.7.12/config/crd/bases/garage.rajsingh.info_garagereferencegrants.yaml

  # VolSync
  - https://raw.githubusercontent.com/backube/volsync/v0.16.0/config/crd/bases/volsync.backube_replicationdestinations.yaml
  - https://raw.githubusercontent.com/backube/volsync/v0.16.0/config/crd/bases/volsync.backube_replicationsources.yaml

# https://github.com/argoproj/argo-helm
# https://artifacthub.io/packages/helm/argo-cd-oci/argo-cd

namespace: argocd

resources:
  - namespace.yaml

helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    version: 9.3.4
    releaseName: argocd
    apiVersions:
      - monitoring.coreos.com/v1
    # https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd#general-parameters
    # or scroll down to "General parameters" on artifacthub
    # or https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
    valuesInline:
      configs:
        cm:
          # https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/#kustomizing-helm-charts
          kustomize.buildOptions: "--enable-helm"

        # Sidecar Config Management Plugin for cdk8s apps.
        # Top-level directories containing an `app.ts` are synthesized with cdk8s.
        # The shared `cdk8s.yaml` + `package.json` live at the repo root, so the
        # generate step cd's to the root, installs deps, (re)generates `imports/`,
        # then synthesizes only this app's `app.ts` into a per-app output dir.
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
        cmp:
          create: true
          plugins:
            cdk8s:
              discover:
                fileName: "app.ts"
              generate:
                command: [bash, -c]
                args:
                  - |
                    set -e
                    app_dir="$(pwd)"
                    root_dir="$(cd .. && pwd)"
                    out_dir="$root_dir/dist/$(basename "$app_dir")"
                    cd "$root_dir"
                    # copyfile backend -> real node_modules (no symlinks into bun's
                    # global cache, which breaks module resolution from nested dirs)
                    if [ -f bun.lock ]; then bun install --frozen-lockfile --backend=copyfile >&2; else bun install --backend=copyfile >&2; fi
                    bun run import >&2
                    # materialize the imports symlink (import script caches via symlink)
                    if [ -L imports ]; then
                      target="$(readlink imports)"
                      rm imports
                      cp -rL "$target" imports
                    fi
                    ./node_modules/.bin/cdk8s synth --app "bun $app_dir/app.ts" --output "$out_dir" >&2
                    cat "$out_dir"/*.k8s.yaml

      global:
        networkPolicy:
          create: true
      
      # resource requests/limits are from https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
      # nvm they are useless
      controller:
        resources:
          limits:
            cpu: 500m
            memory: 900Mi
            ephemeral-storage: 200M
          requests:
            cpu: 250m
            memory: 287Mi
            ephemeral-storage: 0
      dex:
        initImage:
          resources:
            limits:
              cpu: 110m
              memory: 128Mi
              ephemeral-storage: 600M
            requests:
              cpu: 110m
              memory: 64Mi
              ephemeral-storage: 0
        resources:
          limits:
            cpu: 150m
            memory: 200Mi
            ephemeral-storage: 400Mi
          requests:
            cpu: 10m
            memory: 32Mi
            ephemeral-storage: 100Mi
      redis:
        resources:
          limits:
            cpu: 500m
            memory: 300Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 0
      redisSecretInit:
        resources:
          limits:
            cpu: 400m
            memory: 64Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 32Mi
            ephemeral-storage: 0
      server:
        extensions:
          resources:
            limits:
              cpu: 150m
              memory: 128Mi
              ephemeral-storage: 200M
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
        resources:
          limits:
            cpu: 500m
            memory: 600Mi
            ephemeral-storage: 200M
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 50Mi
      repoServer:
        copyutil:
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 600M
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 50Mi

        # Sidecar running the `cdk8s` CMP. Needs `bun` (run/synth cdk8s apps),
        # `nodejs` (cdk8s-cli bin is a node script), `helm` (cdk8s import pulls
        # helm charts), plus a shell + coreutils and ca-certificates.
        # Provided by nixery: https://nixery.dev/
        extraContainers:
          - name: cmp-cdk8s
            command: ["/var/run/argocd/argocd-cmp-server"]
            image: nixery.dev/bun/kubernetes-helm/bash/coreutils/cacert/nodejs
            imagePullPolicy: IfNotPresent
            env:
              # bun needs a writable HOME for its install cache; /tmp is the cmp-tmp emptyDir.
              - name: HOME
                value: /tmp
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
              - mountPath: /var/run/argocd
                name: var-files
              - mountPath: /home/argocd/cmp-server/plugins
                name: plugins
              - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                subPath: cdk8s.yaml
                name: argocd-cmp-cm
              # Do not share the repo-server's /tmp volume (path traversal mitigation).
              - mountPath: /tmp
                name: cmp-tmp

        volumes:
          - name: argocd-cmp-cm
            configMap:
              name: argocd-cmp-cm
          - name: cmp-tmp
            emptyDir: {}

        resources:
          limits:
            cpu: 700m
            memory: 700Mi
            ephemeral-storage: 400Mi
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 100Mi
      applicationSet:
        resources:
          limits:
            cpu: 500m
            memory: 600Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 100Mi
            ephemeral-storage: 0
      notifications:
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
            ephemeral-storage: 200M
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 0

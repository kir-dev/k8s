apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sprint-review-ha5kfu-frontend-buffering
  namespace: sprint-review-ha5kfu
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  buffering:
    # 12 MiB leaves headroom above the roughly 6.7 MiB base64 representation
    # of the application's maximum 5 MiB profile image.
    maxRequestBodyBytes: 12582912
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sprint-review-ha5kfu-frontend
  namespace: sprint-review-ha5kfu
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 35s
    idleConnTimeout: 90s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint-review-ha5kfu-backend
  namespace: sprint-review-ha5kfu
  labels:
    app.kubernetes.io/name: sprint-review-backend
    app.kubernetes.io/instance: sprint-review-ha5kfu
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sprint-review-ha5kfu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sprint-review-backend
      app.kubernetes.io/instance: sprint-review-ha5kfu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sprint-review-backend
        app.kubernetes.io/instance: sprint-review-ha5kfu
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: sprint-review-ha5kfu
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: backend
          # The immutable tag is set centrally in kustomization.yaml.
          image: harbor.sch.bme.hu/org-kir-dev/sprint-review-app-v2-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sprint-review-ha5kfu-db-app
                  key: uri
            - name: AUTHSCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sprint-review-ha5kfu-backend-secrets
                  key: AUTHSCH_CLIENT_ID
            - name: AUTHSCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sprint-review-ha5kfu-backend-secrets
                  key: AUTHSCH_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sprint-review-ha5kfu-backend-secrets
                  key: JWT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: sprint-review-ha5kfu-backend-secrets
                  key: SESSION_SECRET
            - name: FRONTEND_URL
              value: https://ha5kfu.sprint-review.kir-dev.hu
            - name: BACKEND_PUBLIC_URL
              value: https://api.ha5kfu.sprint-review.kir-dev.hu
            - name: ENABLE_SWAGGER
              value: "false"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 150m
              memory: 192Mi
              ephemeral-storage: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

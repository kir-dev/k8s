apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sprint-review-ha5kfu-default-deny
  namespace: sprint-review-ha5kfu
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sprint-review-ha5kfu
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sprint-review-ha5kfu-dns
  namespace: sprint-review-ha5kfu
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sprint-review-ha5kfu
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: vcluster-kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---

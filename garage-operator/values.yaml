# The chart enables admission/conversion webhooks by default and uses
# cert-manager for their serving certificates (already installed in this repo).
webhooks:
  enabled: true
  certManager:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 0
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 200Mi
